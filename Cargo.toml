[package]
name = "kv-store"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
libc = "0.2.186"
rand = { version = "0.10.1", features = ["thread_rng"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3"
